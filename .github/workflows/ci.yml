name: Validate and package

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate syntax, assets, production files and tests
        run: node tools/validate.mjs
      - name: Test native bridge and installer
        if: runner.os != 'Windows'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build installation candidate, source and checksums
        run: node tools/package-release.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SuperX-${{ matrix.os }}
          path: |
            artifacts/SuperX-*.zip
            artifacts/SuperX.zip
            artifacts/SuperX-*-files.json
            artifacts/SuperX-*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
